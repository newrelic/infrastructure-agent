name: .. 🚧 Purge CDN

on:
  workflow_call:
    secrets:
      CLOUDFARE_KEY:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_SESSION_NAME:
        required: true
    inputs:
      AWS_S3_BUCKET_NAME:
        description: 'Bucket the CDN serves; objects listed here are the ones purged'
        required: false
        type: string
        default: 'nr-downloads-main'
      AWS_REGION:
        description: 'Region of the bucket'
        required: false
        type: string
        default: 'us-east-1'


permissions:
  contents: read

env:
  CLOUDFARE_KEY: ${{ secrets.CLOUDFARE_KEY }}
  AWS_S3_BUCKET_NAME: ${{ inputs.AWS_S3_BUCKET_NAME }}
  AWS_REGION: ${{ inputs.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_ROLE_SESSION_NAME: ${{ secrets.AWS_ROLE_SESSION_NAME }}

jobs:
  purge-cdn:
    name: Purge CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: CDN purge
        env:
          CLOUDFARE_KEY: ${{env.CLOUDFARE_KEY }}
          AWS_S3_BUCKET_NAME: ${{ env.AWS_S3_BUCKET_NAME }}
        run: tools/cdn-purge/purge.sh