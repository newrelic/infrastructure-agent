name: . 🚀 🚀 🪜 Staged release for Linux, Windows and Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
      assetsType:
        description: 'Assets type to release: all, docker, targz, zip, msi, deb, rpm'
        required: true
        default: 'all'
      targzOS:
        description: 'OS for which tarballs will be released: all, linux, macos'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:

  config:
    name: Resolve publish version
    uses: ./.github/workflows/component_publish_config.yml
    with:
      ENV: production

  publish-v1:
    name: Publish to s3 production (v1)
    if: ${{ needs.config.outputs.publish_version == 'v1' }}
    needs: config
    uses: ./.github/workflows/publish_stage_v1.yml
    secrets: inherit
    with:
      ENV: production
      TAG: ${{ github.event.inputs.tag }}
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
      PURGE: true

  publish-v2:
    name: Publish to s3 production (v2)
    if: ${{ needs.config.outputs.publish_version == 'v2' }}
    needs: config
    uses: ./.github/workflows/publish_stage_v2.yml
    secrets: inherit
    with:
      ENV: production
      TAG: ${{ github.event.inputs.tag }}
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
      PURGE: true

  publish-docker-images:
    uses: ./.github/workflows/component_docker_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{secrets.OHAI_DOCKER_HUB_ID}}
      DOCKER_HUB_PASSWORD: ${{secrets.OHAI_DOCKER_HUB_PASSWORD}}
    with:
      TAG: ${{ github.event.inputs.tag }}
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
