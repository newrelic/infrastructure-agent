name: . 🚀 🚀 Release for Linux, Windows and Docker

on:
  release:
    types:
      - released
    tags:
      - '*'

permissions:
  contents: read

jobs:

  config:
    name: Resolve publish version
    uses: ./.github/workflows/component_publish_config.yml
    with:
      ENV: production

  publish-v1:
    name: Publish to s3 production (v1)
    if: ${{ needs.config.outputs.publish_version == 'v1' }}
    needs: config
    uses: ./.github/workflows/publish_stage_v1.yml
    secrets: inherit
    with:
      ENV: production
      TAG: ${{ github.event.release.tag_name }}
      ASSETS_TYPE: "all"
      PURGE: true

  publish-v2:
    name: Publish to s3 production (v2)
    if: ${{ needs.config.outputs.publish_version == 'v2' }}
    needs: config
    uses: ./.github/workflows/publish_stage_v2.yml
    secrets: inherit
    with:
      ENV: production
      TAG: ${{ github.event.release.tag_name }}
      ASSETS_TYPE: "all"
      PURGE: true

  publish-docker-images:
    uses: ./.github/workflows/component_docker_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{secrets.OHAI_DOCKER_HUB_ID}}
      DOCKER_HUB_PASSWORD: ${{secrets.OHAI_DOCKER_HUB_PASSWORD}}
    with:
      TAG:  ${{ github.event.release.tag_name }}
      ASSETS_TYPE: "all"

  publish-docker-images-windows:
    uses: ./.github/workflows/component_docker_publish_windows.yml
    secrets:
      OHAI_DOCKER_HUB_ID: ${{secrets.OHAI_DOCKER_HUB_ID}}
      OHAI_DOCKER_HUB_PASSWORD: ${{secrets.OHAI_DOCKER_HUB_PASSWORD}}
    with:
      TAG: ${{ github.event.release.tag_name }}

  molecule-packaging-tests:
    uses: ./.github/workflows/component_molecule_packaging.yml
    needs: [publish-v1, publish-v2]
    if: ${{ !failure() && !cancelled() }}
    with:
      TAG: ${{ github.event.release.tag_name }}
