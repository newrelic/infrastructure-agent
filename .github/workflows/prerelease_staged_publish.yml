name: . 🚀 🪜 Staged pre-release for Linux, Windows

on:
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Bucket set for this run: v1 (legacy) | v2 (new) (empty = PUBLISH_VERSION repository variable). Anything else fails the run'
        required: false
        default: ''
      dest_prefix:
        description: 'Test runs only (needs v2): publish/test under testing-pre-releases/<dest_prefix>/ instead of the repository root'
        required: false
        default: ''
      tag:
        description: 'Tag to pre-release'
        required: true
      assetsType:
        description: 'Assets type to pre-release: all, targz, zip, msi, deb, rpm'
        required: true
        default: 'all'

permissions:
  contents: read

env:
  GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }}
  TAG: ${{ github.event.inputs.tag }}
  DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
  DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
  SCHEMA_BRANCH: ${{ github.event.inputs.tag }}

jobs:

  config:
    name: Resolve publish version
    uses: ./.github/workflows/component_publish_config.yml
    with:
      ENV: staging
      PUBLISH_VERSION: ${{ inputs.publish_version }}
      DEST_PREFIX: ${{ inputs.dest_prefix }}

  publish-linux-v1:
    name: Publish linux artifacts into s3 staging bucket (v1)
    if: ${{ needs.config.outputs.publish_version == 'v1' }}
    needs: config
    uses: ./.github/workflows/component_linux_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
      AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_STAGING }}
      AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
    with:
      ACCESS_POINT_HOST: "staging"
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ github.event.inputs.tag }}
      AWS_S3_BUCKET_NAME: "nr-downloads-ohai-staging"
      AWS_S3_LOCK_BUCKET_NAME: "onhost-ci-lock-staging"
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}

  publish-linux-v2:
    name: Publish linux artifacts into s3 staging bucket (v2)
    if: ${{ needs.config.outputs.publish_version == 'v2' }}
    needs: config
    uses: ./.github/workflows/component_linux_publish_v2.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ (secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING_V2 || secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING) }}
      AWS_SECRET_ACCESS_KEY: ${{ (secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING_V2 || secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING) }}
      AWS_ROLE_ARN: ${{ (secrets.OHAI_AWS_ROLE_ARN_STAGING_V2 || secrets.OHAI_AWS_ROLE_ARN_STAGING) }}
      AWS_ROLE_SESSION_NAME: ${{ (secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING_V2 || secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING) }}
    with:
      ACCESS_POINT_HOST: ${{ needs.config.outputs.access_point_host }}
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ github.event.inputs.tag }}
      AWS_S3_BUCKET_NAME: ${{ needs.config.outputs.aws_s3_bucket_name }}
      AWS_S3_LOCK_BUCKET_NAME: ${{ needs.config.outputs.aws_s3_lock_bucket_name }}
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
      DEST_PREFIX: ${{ needs.config.outputs.dest_prefix }}
      AWS_REGION: ${{ needs.config.outputs.aws_region }}
      AWS_LOCK_REGION: ${{ needs.config.outputs.aws_lock_region }}

  publish-windows-v1:
    name: Publish windows artifacts into s3 staging bucket (v1)
    if: ${{ needs.config.outputs.publish_version == 'v1' }}
    needs: config
    uses: ./.github/workflows/component_windows_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
      AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_STAGING }}
      AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
    with:
      ACCESS_POINT_HOST: "staging"
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ github.event.inputs.tag }}
      AWS_S3_BUCKET_NAME: "nr-downloads-ohai-staging"
      AWS_S3_LOCK_BUCKET_NAME: "onhost-ci-lock-staging"
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
      DISABLE_LOCK: true

  publish-windows-v2:
    name: Publish windows artifacts into s3 staging bucket (v2)
    if: ${{ needs.config.outputs.publish_version == 'v2' }}
    needs: config
    uses: ./.github/workflows/component_windows_publish_v2.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ (secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING_V2 || secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING) }}
      AWS_SECRET_ACCESS_KEY: ${{ (secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING_V2 || secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING) }}
      AWS_ROLE_ARN: ${{ (secrets.OHAI_AWS_ROLE_ARN_STAGING_V2 || secrets.OHAI_AWS_ROLE_ARN_STAGING) }}
      AWS_ROLE_SESSION_NAME: ${{ (secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING_V2 || secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING) }}
    with:
      ACCESS_POINT_HOST: ${{ needs.config.outputs.access_point_host }}
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ github.event.inputs.tag }}
      AWS_S3_BUCKET_NAME: ${{ needs.config.outputs.aws_s3_bucket_name }}
      AWS_S3_LOCK_BUCKET_NAME: ${{ needs.config.outputs.aws_s3_lock_bucket_name }}
      ASSETS_TYPE: ${{ github.event.inputs.assetsType }}
      DEST_PREFIX: ${{ needs.config.outputs.dest_prefix }}
      AWS_REGION: ${{ needs.config.outputs.aws_region }}
      AWS_LOCK_REGION: ${{ needs.config.outputs.aws_lock_region }}
      DISABLE_LOCK: true
