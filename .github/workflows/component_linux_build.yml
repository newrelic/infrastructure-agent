name: .. 🚧 Linux | Compile binaries

on:
  workflow_call:
    secrets:
      DOCKER_HUB_ID:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true
    inputs:
      TAG:
        required: true
        type: string


permissions:
  contents: read

env:
  TAG: ${{ inputs.TAG }}
  DOCKER_HUB_ID: ${{ secrets.DOCKER_HUB_ID }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

jobs:
  test-build:
    name: Test binary compilation for all (linux) platforms:arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Login to DockerHub
        if: ${{ env.DOCKER_HUB_ID != '' && env.DOCKER_HUB_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_ID }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}
      - name: Build all platforms:arch
        run: make ci/build
      - name: Test FIPS binaries for fips compliance
        uses: newrelic/coreint-automation/test-fips-action@v3
        with:
          binaries_path: "./dist"
