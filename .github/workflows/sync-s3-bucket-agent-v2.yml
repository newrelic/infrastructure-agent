name: . ⚠️Sync S3 infrastructure_agent_v2 from infrastructure_agent ⚠️

# Syncs the infrastructure_agent_v2/ folder with infrastructure_agent/ inside one bucket:
#   staging     s3://nr-downloads-ohai-staging/infrastructure_agent/ -> s3://nr-downloads-ohai-staging/infrastructure_agent_v2/
#   production  s3://nr-downloads-main/infrastructure_agent/         -> s3://nr-downloads-main/infrastructure_agent_v2/
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: 'Bucket to sync'
        options:
          - staging
          - production
        default: 'staging'


permissions:
  contents: read

env:
  AWS_REGION: "us-east-1"
  TEMP_AWS_PROFILE: temp_aws_profile

jobs:
  sync-s3-v2:
    name: Synchronize S3 infrastructure_agent_v2 from infrastructure_agent
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Infra Agent repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout s3-pit-restore repository for aws-credentials setup script
        uses: actions/checkout@v4
        with:
          repository: newrelic-forks/s3-pit-restore
          ref: master
          path: s3-pit-restore

      - name: Setup AWS credentials for Staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_STAGING }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Setup AWS credentials for Production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_PRODUCTION }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Run sync on Staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/staging-v2-from-v1

      - name: Run sync on Production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/production-v2-from-v1
