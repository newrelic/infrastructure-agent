name: . ⚠️Sync S3 infrastructure_agent_v2 from infrastructure_agent ⚠️

# Syncs the infrastructure_agent_v2/ folder with infrastructure_agent/ inside one bucket:
#   staging     s3://nr-downloads-ohai-staging/infrastructure_agent/ -> s3://nr-downloads-ohai-staging/infrastructure_agent_v2/
#   production  s3://nr-downloads-main/infrastructure_agent/         -> s3://nr-downloads-main/infrastructure_agent_v2/
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: 'Bucket to sync'
        options:
          - staging
          - production
        default: 'staging'


permissions:
  contents: read

env:
  AWS_REGION: "us-east-1"
  TEMP_AWS_PROFILE: temp_aws_profile

jobs:
  sync-s3-v2:
    name: Synchronize S3 infrastructure_agent_v2 from infrastructure_agent
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Infra Agent repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout s3-pit-restore repository for aws-credentials setup script
        uses: actions/checkout@v4
        with:
          repository: newrelic-forks/s3-pit-restore
          ref: master
          path: s3-pit-restore

      - name: Setup AWS credentials for Staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_STAGING }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Setup AWS credentials for Production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_PRODUCTION }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Run sync on Staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/staging-v2-from-v1

      - name: Run sync on Production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/production-v2-from-v1

      # `aws s3 sync` only compares size and modification time: a file with the same size in both folders that is
      # newer in infrastructure_agent_v2/ is skipped even when its content differs. After a partial publish this
      # leaves the apt InRelease/Release/Release.gpg files (same size, different hashes) pointing at Packages files
      # that were rolled back, and apt clients fail with "size check mismatch". This step compares ETags and copies
      # whatever still differs, then fails if anything is left.
      - name: Copy the files the sync skipped
        env:
          AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}
          BUCKET: ${{ inputs.environment == 'production' && 'nr-downloads-main' || 'nr-downloads-ohai-staging' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/reconcile"
          mkdir -p "$work"

          # "<key relative to the folder><TAB><ETag>" of every object, sorted.
          # - Same exclusions as S3_V2_FILTERS in build/ci.mk, plus folder markers (keys ending in /).
          # - Objects of 8 MiB or more are left out: the CLI copies them in parts, which changes their ETag, so they
          #   would always look different. They are versioned artifacts, the sync already handles them.
          # - Objects whose ETag has a "-" (multipart upload) are left out, whatever their size: the CLI copies an
          #   object under 8 MiB in one request, so the copy gets a plain MD5 ETag and would never match the source.
          #   Some 5-8 MiB packages were uploaded in parts. The sync already handles them.
          list() {
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$1/" \
                --query 'Contents[?Size<`8388608`].[Key,ETag]' --output text |
              awk -F'\t' -v p="$1/" 'NF == 2 {
                k = substr($1, length(p) + 1)
                if (k !~ /\/$/ && k !~ /^(beta|test)\// && k !~ /\/newrelic-infra\.repo$/ && $2 !~ /-/) print k "\t" $2
              }' |
              LC_ALL=C sort
          }
          # Keys of the source that are missing in the destination or have a different ETag.
          differing() {
            LC_ALL=C comm -23 "$work/source.tsv" "$work/dest.tsv" | cut -f1
          }
          copy() {
            aws s3 cp "s3://$BUCKET/infrastructure_agent/$1" "s3://$BUCKET/infrastructure_agent_v2/$1" \
              --copy-props metadata-directive --no-progress
          }
          export -f copy
          export BUCKET

          list infrastructure_agent > "$work/source.tsv"
          list infrastructure_agent_v2 > "$work/dest.tsv"
          differing > "$work/todo.txt"
          echo "$(wc -l < "$work/todo.txt") objects differ after the sync"
          head -n 50 "$work/todo.txt"

          # Index and signature files go last, so a client never reads a new index before the files it lists.
          index='(^|/)(InRelease|Release|Release\.gpg|repomd\.xml|repomd\.xml\.asc)$'
          grep -vE "$index" "$work/todo.txt" > "$work/data.txt" || true
          grep -E "$index" "$work/todo.txt" > "$work/index.txt" || true
          xargs -a "$work/data.txt" -d '\n' -r -P 8 -I{} bash -c 'copy "$1"' _ {}
          while IFS= read -r key; do copy "$key"; done < "$work/index.txt"

          list infrastructure_agent_v2 > "$work/dest.tsv"
          if [ -n "$(differing)" ]; then
            echo "::error::objects still differ between infrastructure_agent/ and infrastructure_agent_v2/"
            differing | head -n 50
            exit 1
          fi
          echo "infrastructure_agent_v2/ matches infrastructure_agent/"
