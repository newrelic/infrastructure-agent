name: . 🚀 🧬 Test package installation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version of the agent to test installation'
        required: true
        type: string
        default: '1.52.3'
      staging:
        description: 'Should run tests using staging bucket?'
        type: boolean
        default: false
        required: false


permissions:
  contents: read

jobs:
  config:
    name: Resolve publish target
    uses: ./.github/workflows/component_publish_config.yml
    with:
      ENV: ${{ github.event.inputs.staging == 'true' && 'staging' || 'production' }}

  molecule-packaging-tests:
    needs: config
    uses: ./.github/workflows/component_molecule_packaging.yml
    with:
      TAG: "${{ github.event.inputs.tag }}"
      REPO_ENDPOINT: ${{ needs.config.outputs.repo_endpoint }}