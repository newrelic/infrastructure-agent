name: . 🐤 Canaries

on:
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Bucket set for this run: v1 (legacy) | v2 (new) (empty = PUBLISH_VERSION repository variable). Anything else fails the run'
        required: false
        default: ''
      tag:
        description: 'Tag to test'
        required: true
      linux:
        description: '🐧 Should create canaries for Linux?'
        type: boolean
        default: true
        required: false
      macos:
        description: '🍏 Should create canaries for MacOS?'
        type: boolean
        default: true
        required: false
      windows:
        description: '🪟 Should create canaries for Windows?'
        type: boolean
        default: true
        required: false
      prune:
        description: '💥 Should prune previous canaries?'
        type: boolean
        default: true
        required: false

permissions:
  contents: read # required by the called component_publish_config.yml
  id-token: write

jobs:
  config:
    name: Resolve publish target
    uses: ./.github/workflows/component_publish_config.yml
    with:
      ENV: staging
      PUBLISH_VERSION: ${{ inputs.publish_version }}

  canaries-windows:
    needs: config
    if: ${{ github.event.inputs.windows == 'true' }}
    uses: ./.github/workflows/component_canaries.yml
    with:
      REPO_ENDPOINT: ${{ needs.config.outputs.repo_endpoint }}
      PLATFORM: "windows"
      TAG: ${{ github.event.inputs.tag }}
    secrets:
      AWS_VPC_SUBNET: ${{secrets.AWS_VPC_SUBNET}}
      
  canaries-linux:
    needs: config
    if: ${{ github.event.inputs.linux == 'true' }}
    uses: ./.github/workflows/component_canaries.yml
    with:
      REPO_ENDPOINT: ${{ needs.config.outputs.repo_endpoint }}
      PLATFORM: "linux"
      TAG: ${{ github.event.inputs.tag }}
    secrets:
      AWS_VPC_SUBNET: ${{secrets.AWS_VPC_SUBNET}}
      
  canaries-macos:
    needs: config
    if: ${{ github.event.inputs.macos == 'true' }}
    uses: ./.github/workflows/component_canaries.yml
    with:
      REPO_ENDPOINT: ${{ needs.config.outputs.repo_endpoint }}
      PLATFORM: "macos"
      TAG: ${{ github.event.inputs.tag }}
    secrets:
      AWS_VPC_SUBNET: ${{secrets.AWS_VPC_SUBNET}}
      
  get_previous_tag:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      previous_tag: ${{ steps.previous_tag_step.outputs.PREVIOUS_TAG }}
    steps:
      - uses: actions/checkout@v2

      - id: previous_tag_step
        run: ./.github/workflows/scripts/previous_version.sh ${{ inputs.TAG }} >> "$GITHUB_OUTPUT"

  prune-previous-canaries-linux:
    needs: get_previous_tag
    if: ${{ github.event.inputs.prune == 'true' && github.event.inputs.linux == 'true' }}
    uses: ./.github/workflows/component_canaries_prune.yml
    with:
      PLATFORM: "linux"
      TAG: ${{ needs.get_previous_tag.outputs.previous_tag }}
    secrets:
      AWS_VPC_SUBNET: ${{secrets.AWS_VPC_SUBNET}}

  prune-previous-canaries-windows:
    needs: get_previous_tag
    if: ${{ github.event.inputs.prune == 'true' && github.event.inputs.windows == 'true' }}
    uses: ./.github/workflows/component_canaries_prune.yml
    with:
      PLATFORM: "windows"
      TAG: ${{ needs.get_previous_tag.outputs.previous_tag }}
    secrets:
      AWS_VPC_SUBNET: ${{secrets.AWS_VPC_SUBNET}}

