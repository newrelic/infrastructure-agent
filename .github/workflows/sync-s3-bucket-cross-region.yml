name: . ⚠️Sync S3 Batch buckets (cross-region) ⚠️

# Syncs the batch-publish buckets (us-east-2), folder infrastructure_agent/ only. Target <- source:
#   batch-staging-from-staging     nr-downloads-ohai-batch-staging <- nr-downloads-ohai-staging
#   batch-prod-from-prod           nr-downloads-ohai-batch-prod    <- nr-downloads-main
#   batch-staging-from-batch-prod  nr-downloads-ohai-batch-staging <- nr-downloads-ohai-batch-prod
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        description: 'Sync to run (target <- source)'
        options:
          - batch-staging-from-staging
          - batch-prod-from-prod
          - batch-staging-from-batch-prod
        default: 'batch-staging-from-staging'


permissions:
  contents: read

env:
  AWS_REGION: "us-east-2"
  TEMP_AWS_PROFILE: temp_aws_profile

jobs:
  sync-s3-batch-buckets:
    name: Synchronize S3 batch buckets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Infra Agent repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout s3-pit-restore repository for aws-credentials setup script
        uses: actions/checkout@v4
        with:
          repository: newrelic-forks/s3-pit-restore
          ref: master
          path: s3-pit-restore

      - name: Setup AWS credentials for Staging
        if: ${{ github.event.inputs.operation == 'batch-staging-from-staging' || github.event.inputs.operation == 'batch-staging-from-batch-prod' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_STAGING }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Setup AWS credentials for Production
        if: ${{ github.event.inputs.operation == 'batch-prod-from-prod' }}
        run: |
          ./s3-pit-restore/setup_aws_credentials.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          AWS_ROLE_ARN: ${{ secrets.OHAI_AWS_ROLE_ARN_PRODUCTION }}
          AWS_ROLE_SESSION_NAME: ${{ secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION }}
          AWS_SESSION_DURATION_SECONDS: 14400
          TEMP_AWS_PROFILE: ${{ env.TEMP_AWS_PROFILE }}

      - name: Run sync on Batch Staging from Staging
        if: ${{ github.event.inputs.operation == 'batch-staging-from-staging' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/batch-staging-from-staging

      - name: Run sync on Batch Prod from Prod
        if: ${{ github.event.inputs.operation == 'batch-prod-from-prod' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/batch-prod-from-prod

      - name: Run sync on Batch Staging from Batch Prod
        if: ${{ github.event.inputs.operation == 'batch-staging-from-batch-prod' }}
        run: |
          AWS_REGION="${{ env.AWS_REGION }}" \
          AWS_PROFILE="${{ env.TEMP_AWS_PROFILE }}" \
          make ci/sync-s3/batch-staging-from-batch-prod
