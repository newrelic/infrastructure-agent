name: .. 🚧 Publish stage | v1 (legacy bucket, publish-action@v1)

# v1 publish stage: runs the v1 component workflows (infrastructure-publish-action@v1) against the legacy
# buckets with the original credentials. This is today's behaviour, unchanged.
# Called by the entrypoint workflows unless the repository variable PUBLISH_VERSION is 'v2'.

on:
  workflow_call:
    inputs:
      ENV:
        description: 'staging | production'
        required: true
        type: string
      TAG:
        required: true
        type: string
      ASSETS_TYPE:
        required: false
        type: string
        default: 'all'
      LINUX:
        description: 'Publish the Linux packages'
        required: false
        type: boolean
        default: true
      WINDOWS:
        description: 'Publish the Windows packages'
        required: false
        type: boolean
        default: true
      WINDOWS_DISABLE_LOCK:
        required: false
        type: boolean
        default: true
      PURGE:
        description: 'Purge the CDN after publishing (production only)'
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFARE_KEY:
        required: false

permissions:
  contents: read

jobs:
  publish-linux:
    name: Publish linux artifacts into s3 (v1)
    if: ${{ inputs.LINUX }}
    uses: ./.github/workflows/component_linux_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION || secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION || secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
      AWS_ROLE_ARN: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_ARN_PRODUCTION || secrets.OHAI_AWS_ROLE_ARN_STAGING }}
      AWS_ROLE_SESSION_NAME: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION || secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
    with:
      ACCESS_POINT_HOST: ${{ inputs.ENV }}
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ inputs.TAG }}
      AWS_S3_BUCKET_NAME: ${{ inputs.ENV == 'production' && 'nr-downloads-main' || 'nr-downloads-ohai-staging' }}
      AWS_S3_LOCK_BUCKET_NAME: ${{ inputs.ENV == 'production' && 'onhost-ci-lock' || 'onhost-ci-lock-staging' }}
      ASSETS_TYPE: ${{ inputs.ASSETS_TYPE }}

  publish-windows:
    name: Publish windows artifacts into s3 (v1)
    if: ${{ inputs.WINDOWS }}
    uses: ./.github/workflows/component_windows_publish.yml
    secrets:
      DOCKER_HUB_ID: ${{ secrets.OHAI_DOCKER_HUB_ID }}
      DOCKER_HUB_PASSWORD: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.OHAI_GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.OHAI_GPG_PRIVATE_KEY_BASE64 }} # base64 encoded
      AWS_ACCESS_KEY_ID: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION || secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION || secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
      AWS_ROLE_ARN: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_ARN_PRODUCTION || secrets.OHAI_AWS_ROLE_ARN_STAGING }}
      AWS_ROLE_SESSION_NAME: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION || secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
    with:
      ACCESS_POINT_HOST: ${{ inputs.ENV }}
      SCHEMA_BRANCH: "master"
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ inputs.TAG }}
      AWS_S3_BUCKET_NAME: ${{ inputs.ENV == 'production' && 'nr-downloads-main' || 'nr-downloads-ohai-staging' }}
      AWS_S3_LOCK_BUCKET_NAME: ${{ inputs.ENV == 'production' && 'onhost-ci-lock' || 'onhost-ci-lock-staging' }}
      ASSETS_TYPE: ${{ inputs.ASSETS_TYPE }}
      DISABLE_LOCK: ${{ inputs.WINDOWS_DISABLE_LOCK }}

  purge-cdn:
    name: Purge CDN (v1)
    if: ${{ inputs.PURGE && !failure() && !cancelled() }}
    needs: [ publish-linux, publish-windows ]
    uses: ./.github/workflows/component_purge_cdn.yml
    secrets:
      CLOUDFARE_KEY: ${{ secrets.CLOUDFARE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ACCESS_KEY_ID_PRODUCTION || secrets.OHAI_AWS_ACCESS_KEY_ID_STAGING }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_SECRET_ACCESS_KEY_PRODUCTION || secrets.OHAI_AWS_SECRET_ACCESS_KEY_STAGING }}
      AWS_ROLE_ARN: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_ARN_PRODUCTION || secrets.OHAI_AWS_ROLE_ARN_STAGING }}
      AWS_ROLE_SESSION_NAME: ${{ inputs.ENV == 'production' && secrets.OHAI_AWS_ROLE_SESSION_NAME_PRODUCTION || secrets.OHAI_AWS_ROLE_SESSION_NAME_STAGING }}
    with:
      AWS_S3_BUCKET_NAME: ${{ inputs.ENV == 'production' && 'nr-downloads-main' || 'nr-downloads-ohai-staging' }}
